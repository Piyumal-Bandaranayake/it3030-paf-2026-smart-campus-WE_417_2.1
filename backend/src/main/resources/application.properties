spring.application.name=smart-campus

# =============================================
# MongoDB Configuration
# =============================================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/smart_campus}
spring.data.mongodb.database=${MONGO_DATABASE:smart_campus}
spring.data.mongodb.auto-index-creation=true

# =============================================
# Server
# =============================================
server.port=${SERVER_PORT:8080}

# =============================================
# Spring Security
# =============================================
spring.security.user.name=${SECURITY_USER_NAME:admin}
spring.security.user.password=${SECURITY_USER_PASSWORD:admin123}

